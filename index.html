<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f3" />
    <link
      rel="preload"
      href="site/components/header.html"
      as="fetch"
      crossorigin="anonymous"
    />
    <link rel="preload" href="site/img/home-hero.webp" as="image" />
    <link rel="preload" href="site/img/stones4.webp" as="image" />
    <link rel="preload" href="site/img/mot2.webp" as="image" />
    <link rel="stylesheet" href="site/css/header.min.css" />
    <link rel="stylesheet" href="site/css/home.min.css" />
    <title>Enduro Siberia 24 — мотоциклы, экипировка и расходники</title>
  </head>
  <body class="home-page">
    <div class="site-header-slot" data-component="header"></div>

    <main>
      <section class="home-hero" id="homeHero" data-home-hero>
        <div class="home-hero__background" aria-hidden="true"></div>
        <div
          class="home-hero__slash home-hero__slash--acid"
          aria-hidden="true"
        ></div>
        <div
          class="home-hero__slash home-hero__slash--dark"
          aria-hidden="true"
        ></div>
        <div
          class="home-hero__slash home-hero__slash--light"
          aria-hidden="true"
        ></div>

        <div class="home-hero__ground" aria-hidden="true">
          <img src="site/img/stones4.webp" alt="" />
        </div>

        <div class="home-hero__manifest" aria-hidden="true">
          <span>СИБИРЬ</span><span>БОЛЬШЕ</span><span>ЧЕМ ДОРОГА</span>
        </div>

        <button
          class="home-hero__arrow home-hero__arrow--prev"
          type="button"
          aria-label="Предыдущая категория"
          data-home-prev
        >
          <span></span>
        </button>
        <button
          class="home-hero__arrow home-hero__arrow--next"
          type="button"
          aria-label="Следующая категория"
          data-home-next
        >
          <span></span>
        </button>

        <div class="home-hero__content">
          <h1 class="home-hero__title" aria-live="polite">
            <span data-home-title-1>МОТОЦИКЛЫ,</span>
            <span data-home-title-2>КОТОРЫЕ ВЫБИРАЮТ</span>
            <strong data-home-title-3>ДУШОЙ</strong>
          </h1>

          <p class="home-hero__copy" data-home-copy>
            Эндуро для бездорожья. Турэндуро для свободы.<br />Питбайки для
            драйва.
          </p>

          <div class="home-hero__actions">
            <a
              class="home-hero__button home-hero__button--primary"
              href="legend-300.html"
              data-home-primary
              >СМОТРЕТЬ ЭНДУРО</a
            >
            <button
              class="home-hero__button home-hero__button--secondary"
              type="button"
              data-home-picker
            >
              ПОДОБРАТЬ ТЕХНИКУ
            </button>
          </div>
        </div>

        <div class="home-hero__scene" aria-label="Категории Enduro Siberia 24">
          <a
            class="home-hero__item is-main"
            href="legend-300.html"
            data-home-item="0"
            data-home-link
            aria-label="Открыть страницу модели Enduro"
          >
            <img src="site/img/enduroHome.webp" alt="Enduro" />
          </a>
          <a
            class="home-hero__item is-next"
            href="legend-300.html"
            data-home-item="1"
            data-home-link
            aria-label="Открыть демонстрационную страницу Tour Enduro"
          >
            <!-- <img src="site/img/tourenduroHome.webp" alt="Tour Enduro" /> -->
            <img src="site/img/tour-enduro.webp" alt="Tour Enduro" />
          </a>
          <a
            class="home-hero__item is-hidden"
            href="legend-300.html"
            data-home-item="2"
            data-home-link
            aria-label="Открыть демонстрационную страницу Pitbike"
          >
            <img src="site/img/pibikeHome.webp" alt="Pitbike" />
          </a>
          <a
            class="home-hero__item home-hero__item--rider is-hidden"
            href="#equipment"
            data-home-item="3"
            data-home-link
            aria-label="Перейти к экипировке"
          >
            <img src="site/img/team.webp" alt="Экипировка для эндуро" />
          </a>
          <a
            class="home-hero__item home-hero__item--parts is-prev"
            href="#consumables"
            data-home-item="4"
            data-home-link
            aria-label="Перейти к расходникам"
          >
            <img src="site/img/rashod.webp" alt="Экипировка для эндуро" />
          </a>
        </div>

        <div class="home-hero__benefits" aria-label="Преимущества">
          <div class="home-hero__benefit">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3 20 6v6c0 5-3.3 8.7-8 10-4.7-1.3-8-5-8-10V6l8-3Z" />
              <path d="m8.8 12 2.1 2.1 4.5-4.7" />
            </svg>
            <span
              ><strong>Проверенная техника</strong
              ><small>Отобранные модели</small></span
            >
          </div>
          <div class="home-hero__benefit">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 3 15 9l6 .8-4.5 4.3 1.1 6.1L12 17.3l-5.6 2.9 1.1-6.1L3 9.8 9 9l3-6Z"
              />
            </svg>
            <span
              ><strong>Сервис и поддержка</strong
              ><small>Помощь после покупки</small></span
            >
          </div>
          <div class="home-hero__benefit">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 7h11v10H3V7Z" />
              <path d="M14 11h4l3 3v3h-7v-6Z" />
              <path d="M7 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z" />
              <path d="M18 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z" />
            </svg>
            <span><strong>Доставка</strong><small>По России</small></span>
          </div>
        </div>

        <div class="home-hero__progress" aria-hidden="true" data-home-progress>
          <span class="is-active"></span><span></span><span></span><span></span
          ><span></span>
        </div>

        <nav class="home-hero__tabs" id="categories" aria-label="Категории">
          <button
            class="home-hero__tab is-active"
            type="button"
            data-home-tab="0"
            id="enduro"
          >
            <span class="home-hero__tab-media"
              ><img src="site/img/enduroHome.webp" alt=""
            /></span>
            <strong>ЭНДУРО</strong>
          </button>
          <button
            class="home-hero__tab"
            type="button"
            data-home-tab="1"
            id="tour-enduro"
          >
            <span class="home-hero__tab-media"
              >
              <!-- <img src="site/img/tourenduroHome.webp" alt="" -->
              ><img src="site/img/tour-enduro.png" alt=""
            /></span>
            <strong>ТУРЭНДУРО</strong>
          </button>
          <button
            class="home-hero__tab"
            type="button"
            data-home-tab="2"
            id="pitbikes"
          >
            <span class="home-hero__tab-media"
              ><img src="site/img/pibikeHome.webp" alt=""
            /></span>
            <strong>ПИТБАЙКИ</strong>
          </button>
          <button
            class="home-hero__tab"
            type="button"
            data-home-tab="3"
            id="equipment"
          >
            <span class="home-hero__tab-media home-hero__tab-media--rider"
              ><img src="site/img/shlem.webp" alt=""
            /></span>
            <strong>ЭКИПИРОВКА</strong>
          </button>
          <button
            class="home-hero__tab"
            type="button"
            data-home-tab="4"
            id="consumables"
          >
            <span class="home-hero__tab-media">
              <img src="site/img/rashod.webp" alt="" />
            </span>
            <strong>РАСХОДНИКИ</strong>
          </button>
        </nav>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script src="site/js/main.js"></script>
    <script src="site/js/home.js"></script>
    <script src="site/js/home-intro.js"></script>
  </body>
</html>
